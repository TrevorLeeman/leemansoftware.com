[tools]
node = "24"
pnpm = "12"

[tasks.dev]
description = "Local dev server at http://localhost:4321"
run = "pnpm dev"

[tasks.build]
description = "Static build into dist/"
run = "pnpm build"

[tasks.check]
description = "Type-check, build, and check the built site (titles, links, structured data)"
run = ["pnpm astro check", "pnpm build", "node scripts/check-dist.mjs"]

[tasks.cards]
description = "Remake the studio's link card (public/og.png). Needs `mise run dev` running, and Google Chrome"
run = """
"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
  --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=4000 \
  --screenshot=public/og.png http://localhost:4321/cards/studio/
sips -g pixelWidth -g pixelHeight public/og.png
"""
